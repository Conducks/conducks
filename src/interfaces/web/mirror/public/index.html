<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conducks Mirror</title>
  <!-- No library and no network: three static files, drawn with plain DOM and SVG (ADR 0027). -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage" class="stage"></div>
  <header class="hud">
    <div class="ident">
      <img class="ident-logo" src="logo.png" alt="Conducks">
      <span id="project-name" class="ident-name">mirror</span>
    </div>
    <div id="strip" class="strip"></div>
    <div class="search">
      <input id="search" class="search-input" type="search" placeholder="search" autocomplete="off" spellcheck="false">
      <ul id="search-results" class="search-results" hidden></ul>
    </div>
    <span id="live" class="live"></span>
  </header>
  <div class="trail">
    <nav id="crumbs" class="crumbs"></nav>
    <span id="project-summary" class="trail-sum">reading the graph</span>
  </div>
  <p id="verdict" class="verdict"></p>
  <aside id="card" class="card" hidden></aside>
  <script src="app.js"></script>
</body>
</html>
