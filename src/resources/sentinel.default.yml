version: 1
rules:
  - id: no_cycles
    name: No import cycles
    condition: has_cycles
    severity: error
    enabled: true
  - id: rank_violations
    name: No rank violations
    condition: rank_violation
    severity: warning
    enabled: true
  - id: dead_code
    name: No dead modules
    condition: dead_code
    severity: info
    enabled: false
  - id: high_churn
    name: No high-churn hubs
    condition: high_churn
    severity: warning
    threshold: 30
    enabled: false
  - id: deep_nesting
    name: No deeply nested modules
    condition: deep_nesting
    severity: info
    threshold: 5
    enabled: false
